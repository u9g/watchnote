<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchnote — explainer</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #1d1d1f; color: #eee; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .stage { position: relative; width: min(96vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .big-play { position: absolute; inset: 0; margin: auto; width: 120px; height: 120px; border-radius: 50%; border: 0; background: #2f6fed; color: #fff; font-size: 44px; cursor: pointer; box-shadow: 0 10px 40px rgba(47,111,237,.5); }
  .big-play[hidden] { display: none; }
  .controls { width: min(96vw, calc((100vh - 90px) * 16 / 9)); display: flex; align-items: center; gap: 10px; }
  .controls button { background: #2c2c30; color: #eee; border: 1px solid #3a3a40; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  .controls button:disabled { opacity: .5; cursor: default; }
  .bar { flex: 1; height: 8px; background: #3a3a40; border-radius: 4px; cursor: pointer; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #2f6fed; border-radius: 4px; }
  .time { font-variant-numeric: tabular-nums; color: #aaa; min-width: 90px; text-align: right; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <button class="big-play" id="bigPlay" aria-label="Play with sound">▶</button>
</div>
<div class="controls">
  <button id="play">▶ Play</button>
  <button id="restart">↺ Restart</button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <span class="time" id="time">0:00 / 0:00</span>
  <button id="export">⬇ Export .webm</button>
</div>
<script>
"use strict";
// ---------- palette & helpers (colours match static/style.css) ----------
const BG = "#f4f1ec", INK = "#1d1d1f", MUTED = "#6b6b70", LINE = "#e6e2db", ACCENT = "#2f6fed", ACCENT_SOFT = "#e8efff";
const OPEN = "#1f883d", MERGED = "#8250df", CLOSED = "#cf222e", NOTE = "#fff7d6", NOTE_LINE = "#f0d98a", NOTE_INK = "#5a4a12";
const SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
const W = 1280, H = 720;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.scale(canvas.width / W, canvas.height / H);

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function alpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function scaleAt(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-x, -y); fn(); ctx.restore(); }
function rr(x, y, w, h, r, fill, stroke, lw = 1.5) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function card(x, y, w, h, r = 16, fill = "#fff") {
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.12)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(x, y, w, h, r, fill); ctx.restore();
}
function font(size, weight = 400, family = SANS) { ctx.font = `${weight} ${size}px ${family}`; }
function text(s, x, y, { size = 22, weight = 400, color = INK, align = "left", family = SANS, base = "alphabetic" } = {}) {
  font(size, weight, family); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function wrap(s, x, y, maxW, lh, opts = {}) {
  font(opts.size || 22, opts.weight || 400, opts.family || SANS);
  const words = s.split(" "); let line = "", yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { text(line, x, yy, opts); line = w; yy += lh; font(opts.size || 22, opts.weight || 400, opts.family || SANS); }
    else line = test;
  }
  if (line) text(line, x, yy, opts);
  return yy;
}
function pill(x, y, label, bg, fg, size = 14, padX = 10, h = 26) {
  font(size, 700); const w = ctx.measureText(label).width + padX * 2;
  rr(x, y, w, h, h / 2, bg); text(label, x + w / 2, y + h / 2 + 1, { size, weight: 700, color: fg, align: "center", base: "middle" });
  return w;
}
const typed = (s, p) => s.slice(0, Math.floor(s.length * clamp(p)));

function logo(x, y, s) {
  rr(x - s / 2, y - s / 2, s, s, s * .28, ACCENT);
  ctx.beginPath(); ctx.ellipse(x, y - s / 32, s * 7 / 32, s * 6 / 32, 0, 0, Math.PI * 2);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = s * 3 / 32; ctx.stroke();
}
function pointer(x, y, down) {
  ctx.save(); ctx.translate(x, y); if (down) ctx.scale(.85, .85);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 26); ctx.lineTo(7, 20); ctx.lineTo(12, 31); ctx.lineTo(17, 29); ctx.lineTo(12, 18); ctx.lineTo(21, 18); ctx.closePath();
  ctx.fillStyle = INK; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  if (down) { ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.strokeStyle = "rgba(47,111,237,.5)"; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}
// Moves the pointer through [time, x, y, pressed?] keyframes.
function pointerPath(t, keys) {
  if (t < keys[0][0]) return;
  let x = keys[0][1], y = keys[0][2], down = false;
  for (let i = 1; i < keys.length; i++) {
    const [t0, x0, y0] = keys[i - 1], [t1, x1, y1, press] = keys[i];
    if (t >= t0) { const p = easeInOut(seg(t, t0, t1)); x = lerp(x0, x1, p); y = lerp(y0, y1, p); }
    if (press && t >= t1 && t < t1 + .18) down = true;
  }
  alpha(seg(t, keys[0][0], keys[0][0] + .3), () => pointer(x, y, down));
}
function heading(t, num, s) {
  alpha(seg(t, .1, .6), () => {
    const dy = (1 - easeOut(seg(t, .1, .7))) * 14;
    let x = 60;
    if (num) { rr(x, 42 + dy, 40, 40, 20, INK); text(String(num), x + 20, 63 + dy, { size: 20, weight: 800, color: "#fff", align: "center", base: "middle" }); x += 56; }
    text(s, x, 72 + dy, { size: 34, weight: 800 });
  });
}
function caret(x, y, h, t) { if (Math.floor(t * 2.5) % 2 === 0) { ctx.fillStyle = ACCENT; ctx.fillRect(x + 2, y, 2, h); } }

// ---------- sound (all synthesised with Web Audio) ----------
let ac = null, master = null, recDest = null, noiseBuf = null;
function ensureAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  master = ac.createGain(); master.gain.value = .9;
  master.connect(comp); comp.connect(ac.destination);
  recDest = ac.createMediaStreamDestination(); comp.connect(recDest);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function osc(out, when, type, f, a, peak, d, f2) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, when);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, when + a + d);
  g.gain.setValueAtTime(.0001, when); g.gain.exponentialRampToValueAtTime(peak, when + a); g.gain.exponentialRampToValueAtTime(.0001, when + a + d);
  o.connect(g).connect(out); o.start(when); o.stop(when + a + d + .05);
}
function noise(out, when, dur, peak, type, f, f2, q = 1) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const bf = ac.createBiquadFilter(); bf.type = type; bf.Q.value = q; bf.frequency.setValueAtTime(f, when);
  if (f2) bf.frequency.exponentialRampToValueAtTime(f2, when + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(.0001, when); g.gain.linearRampToValueAtTime(peak, when + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, when + dur);
  s.connect(bf).connect(g).connect(out); s.start(when, Math.random() * .5); s.stop(when + dur + .05);
}
function pad(out, when, freqs, dur, peak) {
  for (const f of freqs) for (const [type, det] of [["sine", 0], ["triangle", 4]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.detune.value = det;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + .8); g.gain.setValueAtTime(peak, when + dur - .4); g.gain.linearRampToValueAtTime(0, when + dur + .3);
    o.connect(g).connect(out); o.start(when); o.stop(when + dur + .35);
  }
}
const SFX = {
  pop: (o, w) => osc(o, w, "sine", 320, .005, .35, .14, 900),
  click: (o, w) => { noise(o, w, .045, .45, "highpass", 2500); osc(o, w, "square", 1800, .001, .04, .03); },
  key: (o, w) => noise(o, w, .035, .22, "bandpass", 2800 + Math.random() * 2200, null, 2.5),
  whoosh: (o, w) => noise(o, w, .55, .22, "bandpass", 350, 3200, 1.1),
  notif: (o, w) => { osc(o, w, "square", 440, .003, .05, .09); osc(o, w + .07, "square", 330, .003, .05, .12); },
  huh: (o, w) => { osc(o, w, "sine", 620, .01, .25, .18, 700); osc(o, w + .2, "sine", 560, .01, .25, .35, 380); },
  ping: (o, w) => osc(o, w, "sine", 880, .004, .12, .1),
  low: (o, w) => osc(o, w, "sine", 330, .004, .16, .16),
  ding: (o, w) => { osc(o, w, "sine", 1318.5, .005, .3, 1.2); osc(o, w + .12, "sine", 1975.5, .005, .25, 1.4); },
  chime: (o, w) => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc(o, w + i * .08, "triangle", f, .005, .2, .9)),
  success: (o, w) => [659.25, 987.77].forEach((f, i) => osc(o, w + i * .1, "sine", f, .005, .25, .5)),
  finale: (o, w) => [261.63, 329.63, 392, 523.25, 659.25].forEach((f, i) => osc(o, w + i * .06, "triangle", f, .01, .16, 2.4)),
};

// ---------- scenes ----------
const NOTE_TEXT = "Waiting on this fix before we upgrade the worker pool.";
const URL_TEXT = "github.com/octo/hello/issues/7";
const TITLE = "Retry loop races on shutdown";

function typeCues(start, end, s) {
  const out = []; for (let i = 0; i < s.length; i++) if (s[i] !== " ") out.push([start + (end - start) * i / s.length, "key"]);
  return out;
}

const SCENES = [
{ // 1. Title
  dur: 5, cues: [[.3, "pop"], [.8, "whoosh"]],
  draw(t) {
    for (let i = 0; i < 6; i++) {
      const a = t * .25 + i * 1.05;
      ctx.beginPath(); ctx.arc(640 + Math.cos(a) * (300 + i * 30), 330 + Math.sin(a * 1.3) * 180, 60 + i * 12, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? "rgba(47,111,237,.06)" : "rgba(240,217,138,.18)"; ctx.fill();
    }
    const p = seg(t, .2, .8);
    if (p > 0) scaleAt(640, 270, back(p), () => logo(640, 270, 120));
    alpha(seg(t, .8, 1.3), () => text("Watchnote", 640, 420 + (1 - easeOut(seg(t, .8, 1.4))) * 20, { size: 76, weight: 800, align: "center" }));
    alpha(seg(t, 1.6, 2.2), () => text("Watch GitHub issues & PRs — and remember why.", 640, 480, { size: 30, color: MUTED, align: "center" }));
  },
},
{ // 2. The problem
  dur: 7, cues: [...[0, 1, 2, 3, 4, 5, 6, 7].map(i => [.5 + i * .28, "notif"]), [3.2, "huh"], [5, "whoosh"]],
  draw(t) {
    heading(t, 0, "You follow a lot of issues and PRs…");
    card(340, 120, 600, 450);
    text("Inbox", 370, 160, { size: 22, weight: 800 });
    text("GitHub notifications", 910, 160, { size: 15, color: MUTED, align: "right" });
    const rows = [
      ["octo/hello", "Re: Retry loop races on shutdown (#7)"], ["acme/api", "Bump serde to 1.0.210 (#412)"],
      ["vitejs/vite", "HMR drops CSS on reload (#23585)"], ["octo/hello", "Re: Retry loop races on shutdown (#7)"],
      ["rust-lang/rust", "ICE in borrowck with async closures (#12931)"], ["acme/web", "Flaky login test on CI (#88)"],
      ["bazelbuild/rules_rust", "Windows TMP path too long (#2217)"], ["octo/hello", "Re: Retry loop races on shutdown (#7)"],
    ];
    rows.forEach(([repo, subj], i) => {
      const p = easeOut(seg(t, .5 + i * .28, .8 + i * .28)); if (p <= 0) return;
      const y = 182 + i * 46;
      alpha(p, () => {
        const x = 360 + (1 - p) * 120;
        rr(x, y, 560, 40, 8, i % 2 ? "#fff" : "#faf9f7");
        ctx.beginPath(); ctx.arc(x + 18, y + 20, 5, 0, 7); ctx.fillStyle = ACCENT; ctx.fill();
        text(repo, x + 34, y + 26, { size: 15, weight: 700 });
        text(subj.length > 42 ? subj.slice(0, 41) + "…" : subj, x + 200, y + 26, { size: 15, color: MUTED });
      });
    });
    const q = seg(t, 3.2, 3.7);
    if (q > 0) {
      alpha(q * .55, () => rr(340, 120, 600, 450, 16, BG));
      scaleAt(640, 330, back(q), () => {
        card(390, 270, 500, 110, 20);
        text("Wait… why was I watching this one?", 640, 336, { size: 28, weight: 800, align: "center" });
      });
      for (let i = 0; i < 5; i++) {
        const a = seg(t, 3.5 + i * .15, 4 + i * .15);
        alpha(a * (1 - seg(t, 6.2, 6.6)), () => text("?", 330 + i * 150, 250 - easeOut(a) * 40 - (i % 2) * 30, { size: 40 + (i % 3) * 10, weight: 800, color: i % 2 ? ACCENT : "#c9a227", align: "center" }));
      }
    }
    alpha(seg(t, 5, 5.5), () => text("Watchnote keeps the why with every update.", 640, 640, { size: 30, weight: 700, color: ACCENT, align: "center" }));
  },
},
{ // 3. Save a watch
  dur: 12,
  cues: [...typeCues(.6, 2.1, URL_TEXT), [2.4, "pop"], ...typeCues(3.4, 6.4, NOTE_TEXT), [6.8, "pop"], [8, "click"], [9.4, "click"], [9.5, "success"]],
  draw(t) {
    heading(t, 1, "Paste a link. Write down why.");
    card(300, 110, 680, 500);
    text("ISSUE OR PR LINK", 330, 150, { size: 13, weight: 700, color: MUTED });
    const typingUrl = t > .6 && t < 2.3;
    rr(330, 162, 620, 50, 10, "#fff", typingUrl ? ACCENT : "#d6d6d6");
    const url = typed(URL_TEXT, seg(t, .6, 2.1));
    if (url) { const w = text(url, 346, 194, { size: 18, family: MONO }); if (typingUrl) caret(346 + w, 176, 22, t); }
    else text("Paste an issue or PR link", 346, 194, { size: 18, color: "#aaa" });

    const pv = seg(t, 2.4, 2.8);
    alpha(pv, () => {
      const y = 226 + (1 - easeOut(pv)) * 10;
      rr(330, y, 620, 70, 10, "#fafafa", LINE);
      const pw = pill(346, y + 12, "● Open", OPEN, "#fff", 13);
      text("octo/hello#7", 346 + pw + 10, y + 30, { size: 15, color: MUTED, family: MONO });
      text(TITLE, 346, y + 58, { size: 20, weight: 700 });
    });

    alpha(seg(t, 2.9, 3.3), () => {
      text("WHY ARE YOU WATCHING THIS?", 330, 330, { size: 13, weight: 700, color: MUTED });
      const typing = t > 3.4 && t < 6.5;
      rr(330, 342, 620, 88, 10, NOTE, typing ? "#d9b64a" : NOTE_LINE, typing ? 2 : 1.5);
      const note = typed(NOTE_TEXT, seg(t, 3.4, 6.4));
      if (note) { font(19, 500); const w = text(note, 346, 376, { size: 19, weight: 500, color: NOTE_INK }); if (typing) caret(346 + w, 360, 22, t); }
      else text("e.g. waiting on this before we can upgrade", 346, 376, { size: 19, color: "#b8a86a" });
    });

    const ch = seg(t, 6.8, 7.2);
    alpha(ch, () => {
      text("NOTIFY ME ABOUT", 330, 458, { size: 13, weight: 700, color: MUTED });
      const on = t >= 8;
      let x = 330;
      for (const [label, sel] of [["Everything", on], ["Status only", false], ["Custom mix", false]]) {
        font(15, sel ? 700 : 500); const w = ctx.measureText(label).width + 28;
        rr(x, 470, w, 34, 17, sel ? ACCENT_SOFT : "#fff", sel ? ACCENT : "#d6d6d6");
        text(label, x + w / 2, 488, { size: 15, weight: sel ? 700 : 500, color: sel ? ACCENT : INK, align: "center", base: "middle" });
        x += w + 10;
      }
      const done = t >= 9.4, bump = done ? 1 + .04 * Math.sin(Math.PI * seg(t, 9.4, 9.7)) : 1;
      scaleAt(640, 556, bump, () => {
        rr(330, 530, 620, 52, 10, done ? OPEN : ACCENT);
        text(done ? "✓ Watching" : "Watch", 640, 557, { size: 19, weight: 700, color: "#fff", align: "center", base: "middle" });
      });
    });
    alpha(seg(t, 10, 10.5), () => text("Your note is what every email leads with.", 640, 660, { size: 24, weight: 600, color: MUTED, align: "center" }));
    pointerPath(t, [[7.2, 1060, 660], [7.9, 385, 490, true], [9.1, 640, 560], [9.4, 640, 560, true], [10.6, 1000, 650]]);
  },
},
{ // 4. Polling
  dur: 11,
  cues: [...[.8, 2.2, 3.6, 5].flatMap((s, i) => [[s, "ping"], [s + 1.2, i < 3 ? "low" : "pop"]]), [6.25, "success"],
         [5.9, "pop"], [6.3, "pop"], [6.7, "pop"], [7.1, "pop"], [7.8, "whoosh"]],
  draw(t) {
    heading(t, 2, "Watchnote checks GitHub for you.");
    // GitHub box
    rr(110, 170, 310, 200, 18, "#24292f");
    ctx.beginPath(); ctx.arc(265, 245, 38, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(265, 250, 22, 0, 7); ctx.fillStyle = "#24292f"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(247, 236); ctx.lineTo(247, 214); ctx.lineTo(258, 228); ctx.moveTo(283, 236); ctx.lineTo(283, 214); ctx.lineTo(272, 228); ctx.fillStyle = "#24292f"; ctx.fill();
    text("GitHub", 265, 330, { size: 26, weight: 800, color: "#fff", align: "center" });
    text("octo/hello#7", 265, 356, { size: 15, color: "#9aa4af", align: "center", family: MONO });
    // Watchnote box
    card(860, 170, 310, 200, 18);
    logo(1015, 240, 64);
    text("Watchnote", 1015, 330, { size: 26, weight: 800, align: "center" });
    text("polls every watched item", 1015, 356, { size: 15, color: MUTED, align: "center" });
    ctx.setLineDash([6, 8]); ctx.strokeStyle = "#cfc9bf"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(430, 245); ctx.lineTo(850, 245); ctx.moveTo(430, 300); ctx.lineTo(850, 300); ctx.stroke(); ctx.setLineDash([]);

    [.8, 2.2, 3.6, 5].forEach((s, i) => {
      const req = seg(t, s, s + .6), res = seg(t, s + .6, s + 1.2);
      if (req > 0 && req < 1) { const x = lerp(850, 430, easeInOut(req)); rr(x - 60, 231, 120, 28, 14, ACCENT_SOFT, ACCENT); text("GET  #7", x, 246, { size: 13, weight: 700, color: ACCENT, align: "center", base: "middle" }); }
      if (res > 0 && res < 1) {
        const x = lerp(430, 850, easeInOut(res)), hot = i === 3, label = hot ? "200 · new activity" : "304 Not Modified";
        font(13, 700); const w = ctx.measureText(label).width + 24;
        rr(x - w / 2, 286, w, 28, 14, hot ? ACCENT : "#e9e6e0"); text(label, x, 301, { size: 13, weight: 700, color: hot ? "#fff" : MUTED, align: "center", base: "middle" });
      }
    });
    alpha(seg(t, 2, 2.4) * (1 - seg(t, 4.8, 5.2)), () => text("304s are free: no rate limit spent when nothing changed", 640, 410, { size: 17, color: MUTED, align: "center" }));

    const ev = [[MUTED, "maintainer commented"], [OPEN, "review: approved"], [ACCENT, "2 commits pushed"], [MERGED, "merged into main"]];
    alpha(seg(t, 5.8, 6), () => { card(860, 395, 310, 200, 14); text("NEW ON THE TIMELINE", 880, 425, { size: 12, weight: 700, color: MUTED }); });
    ev.forEach(([c, s], i) => {
      const p = seg(t, 5.9 + i * .4, 6.2 + i * .4);
      alpha(p, () => {
        const y = 450 + i * 36, x = 880 + (1 - easeOut(p)) * 20;
        ctx.beginPath(); ctx.arc(x + 7, y + 10, 7, 0, 7); ctx.fillStyle = c; ctx.fill();
        text(s, x + 24, y + 16, { size: 17, weight: 600 });
      });
    });

    alpha(seg(t, 7.8, 8.3), () => {
      card(110, 395, 310, 200, 14);
      text("QUIET ITEMS BACK OFF", 130, 425, { size: 12, weight: 700, color: MUTED });

let acc = 0; for (const s of SCENES) { s.start = acc; acc += s.dur; }
const DURATION = acc;

// Background music: a soft chord pad plus a plucked arpeggio, 96 bpm.
const BAR = 2.5, CHORDS = [[261.63, 329.63, 392, 493.88], [220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [196, 246.94, 293.66, 392]];
function musicCues() {
  const out = [];
  for (let b = 0, t = 1.5; t < DURATION - 3; b++, t += BAR) {
    const ch = CHORDS[b % 4];
    out.push([t, "pad", ch.map(f => f / 2)]);
    for (let i = 0; i < 8; i++) if (t + i * BAR / 8 < DURATION - 3) out.push([t + i * BAR / 8, "pluck", ch[[0, 1, 2, 3, 2, 1, 2, 3][i]] * (i === 4 ? 2 : 1)]);
  }
  return out;
}
const CUES = [...SCENES.flatMap(s => s.cues.map(([t, n]) => [s.start + t, n])), ...musicCues()].sort((a, b) => a[0] - b[0]);

let run = null;
function scheduleAudio(from, t0) {
  const out = ac.createGain(); out.connect(master);
  const music = ac.createGain(); music.gain.value = .55; music.connect(out);
  for (const [t, name, arg] of CUES) {
    if (t < from - .02) continue;
    const when = t0 + (t - from);
    if (name === "pad") pad(music, when, arg, BAR, .018);
    else if (name === "pluck") osc(music, when, "triangle", arg, .005, .05, .35);
    else SFX[name](out, when);
  }
  return out;
}
function stopAudio() {
  if (!run) return;
  const g = run; run = null;
  g.gain.setTargetAtTime(0, ac.currentTime, .02); setTimeout(() => g.disconnect(), 200);
}

// ---------- playback ----------
let poster = true, playing = false, from = 0, t0 = 0, pausedAt = 0, recorder = null;
const now = () => playing ? Math.min(DURATION, from + (ac.currentTime - t0)) : pausedAt;
function play(at = pausedAt) {
  ensureAudio(); ac.resume(); stopAudio();
  if (at >= DURATION) at = 0;
  from = at; t0 = ac.currentTime + .05; run = scheduleAudio(from, t0); playing = true;
  poster = false; bigPlay.hidden = true; ui();
}
function pause() { pausedAt = now(); playing = false; stopAudio(); ui(); }

function render(time) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const s = SCENES.find(s => time < s.start + s.dur) || SCENES[SCENES.length - 1];
  const t = time - s.start, fade = Math.min(seg(t, 0, .35), 1 - seg(t, s.dur - .35, s.dur));
  const last = s === SCENES[SCENES.length - 1];
  alpha(last ? seg(t, 0, .35) : fade, () => s.draw(t));
}

const $ = id => document.getElementById(id);
const bigPlay = $("bigPlay"), playBtn = $("play"), fill = $("fill"), timeEl = $("time"), exportBtn = $("export");
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function ui() {
  playBtn.textContent = playing ? "❚❚ Pause" : "▶ Play";
  for (const b of [playBtn, $("restart"), exportBtn]) b.disabled = !!recorder;
}
function frame() {
  const time = now();
  if (playing && time >= DURATION) { pausedAt = DURATION; playing = false; stopAudio(); ui(); if (recorder) recorder.stop(); }
  render(poster ? 2.5 : time);
  fill.style.width = (100 * time / DURATION) + "%";
  timeEl.textContent = `${fmt(time)} / ${fmt(DURATION)}`;
  requestAnimationFrame(frame);
}

bigPlay.onclick = () => play(0);
playBtn.onclick = () => playing ? pause() : play();
$("restart").onclick = () => play(0);
$("bar").onclick = e => {
  if (recorder) return;
  const r = e.currentTarget.getBoundingClientRect(), at = DURATION * clamp((e.clientX - r.left) / r.width);
  if (playing) play(at); else { pausedAt = at; poster = false; bigPlay.hidden = true; }
};
document.addEventListener("keydown", e => { if (e.code === "Space" && !recorder) { e.preventDefault(); playing ? pause() : play(); } });

// Records the whole video in real time (canvas + audio) and resolves with a WebM blob.
function record() {
  ensureAudio();
  return new Promise(resolve => {
    const stream = new MediaStream([...canvas.captureStream(60).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    const type = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
    const chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => { recorder = null; ui(); resolve(new Blob(chunks, { type: "video/webm" })); };
    recorder.start(1000); play(0);
  });
}
exportBtn.onclick = async () => {
  const blob = await record();
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "watchnote-explainer.webm"; a.click();
};
window.explainer = { play, pause, record, render, DURATION };

requestAnimationFrame(frame);
