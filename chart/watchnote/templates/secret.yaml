{{- if not .Values.existingSecret }}
{{- $name := include "watchnote.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if not $secretKey }}
{{- if and $existing (index $existing.data "SECRET_KEY") }}
{{- $secretKey = index $existing.data "SECRET_KEY" | b64dec }}
{{- else }}
{{- $secretKey = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "watchnote.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
  GOOGLE_CLIENT_ID: {{ required "secrets.googleClientId is required (or set existingSecret)" .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ required "secrets.googleClientSecret is required (or set existingSecret)" .Values.secrets.googleClientSecret | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
