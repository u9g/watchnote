name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint chart/watchnote --strict \
            --set baseUrl=https://watchnote.example.com \
            --set secrets.googleClientId=id --set secrets.googleClientSecret=secret \
            --set mail.from=notify@example.com --set mail.smtpHost=smtp.example.com \
            --set ingress.enabled=true --set ingress.tls.enabled=true
          helm lint chart/watchnote --strict \
            --set baseUrl=https://watchnote.example.com --set existingSecret=watchnote \
            --set mail.existingSecret=watchnote-smtp

  image:
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On a vX.Y.Z tag, publish the chart to oci://ghcr.io/<owner>/charts/watchnote
  # with its version and appVersion set from the tag.
  chart-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          version="${GITHUB_REF_NAME#v}"
          helm package chart/watchnote --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "watchnote-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
